<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBank - Transfer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
        <script>
            $(document).ready(function () {
                const socket = io();

                socket.on('connect', function () {
                    console.log('Websocket connected!');
                });

                socket.on('new_notification', function (data) {
                    $('#notificationBell i').css('color', 'yellow');
                    $('#notificationBadge').show();
                    console.log('Notification UPDATED');

                    var notificationContent = $('#notificationsContainer').html();
                    if (notificationContent == "No new notifications.") {
                        $('#notificationsContainer').html('');
                    }
                    $('#notificationsContainer').append('<p>' + data.message + '</p><div class = "divider"> </div>');

                    //Automatic modal
                    $('#notificationModal').modal('show');
                });


                $('#notificationBell').click(function () {
                    $('#notificationBadge').hide();
                    $('#notificationBell i').css('color', '#fff');
                    $('#notificationModal').modal('show');
                });
            });
        </script>
    <script type="text/javascript">
        function showErrorModal(username) {
            document.getElementById('generatedUsername').innerText = username;
            $('#usernameModal').modal('show');
        }
    </script>
    <style>
        body {
            background-color: #f0f0f0;
        }
        /* Oracle's primary color */
        
        .navbar-custom {
            background-color:
                {% if user_data.bank|lower == 'bankchicago' %}
                    #F80000D0
                {% elif user_data.bank|lower == 'bankmex' %}
                    #312D2A
                {% else %}
                    #F80000D0 /* fallback/oracle red */
                {% endif %}
                ;
        }
        
        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link,
        .navbar-custom .btn-logout {
            color: #ffffff;
        }
        
        .account-card {
            background-color: #ffffff;
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }
        
        .divider {
            border-top: 1px solid #ccc;
            margin: 10px 0;
        }
        
        .account-info {
            font-size: 18px;
        }
        
        .balance {
            font-weight: bold;
            font-size: 22px;
        }
        
        .ml-auto {
            margin-left: auto;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand" href="#">
            <img src="{{ url_for('static', filename='images/oracle-blk.png') }}" alt="Oracle Logo"
                style="height: 30px; margin-right: 20px;"> CLOUDBANK
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-arrow-down" style="color: black;"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav">
                <a class="nav-item nav-link" href="{{ url_for('dashboard') }}">Home</a>
                <a class="nav-item nav-link" href="{{ url_for('transfer') }}">Transfer</a>
                <a class="nav-item nav-link" href="{{ url_for('account_details') }}">Account</a>
            </div>
        </div>
        <div id="notificationBell" class="navbar-nav nav-item ml-auto" style="color: #fff; cursor: pointer;">
            <i class="fas fa-bell"></i>
            <span class="badge badge-danger" id="notificationBadge"
                style="position: absolute; top: -10px; right: -10px; display: none; color: white;">!</span>
        </div>
        <!-- <div class="collapse navbar-collapse" id="navbarNavAltMarkup1">
                <span class="navbar-brand ml-auto" id="navbarBank">
                    {{ user_data.bank }}
                </span>
                <button class="btn btn-outline-light btn-logout ml-auto" onclick="location.href='/logout'">Logout</button>
            </div> -->
        <div class="d-flex align-items-center ml-3">
            <span class="navbar-text" id="navbarBank">{{ user_data.bank }}</span>
            <button class="btn btn-outline-light btn-logout ml-2" onclick="location.href='/logout'">
                Logout
            </button>
        </div>
    </nav>

    <!-- Modal -->
    <div class="modal fade" id="usernameModal" tabindex="-1" aria-labelledby="usernameModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="usernameModalLabel">Transfer Initiation Error</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
                </div>
                <div class="modal-body">
                    <span id="generatedUsername"></span>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    {% if error %}
    <script type="text/javascript">
        showErrorModal('{{ error }}');
    </script>
    {% endif %}


    <div class="container mt-5">
        <h2>Account Transfer</h2>
        <form action="{{ url_for('transfer') }}" method="post">
            <div class="form-group">
                <label for="from_account">From Account:</label>
                <select id="from_account" name="from_account" class="form-control">
                    <option value="" disabled selected>Please choose one</option>
                    {% for account_type, accounts in user_data.items() %}
                        {% if account_type in ['CHECKING', 'SAVING'] %}
                            {% for account in accounts %}
                                <option value="{{ account['account_number'] }}">
                                    {{ account_type }}: {{ account['account_number'] }} - ${{ account['balance_amount'] }}
                                </option>
                            {% endfor %}
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="to_account">To Account:</label>
                <input type="text" id="to_account" name="to_account" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" name="amount" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Initiate Transfer</button>
        </form>
    </div>

        <div class="modal fade" id="notificationModal" tabindex="-1" role="dialog" aria-labelledby="notificationModalLabel"
            aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="notificationModalLabel">Notifications</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div id="notificationsContainer">No new notifications.</div>
                    </div>
                </div>
            </div>
        </div>

</body>

</html>
