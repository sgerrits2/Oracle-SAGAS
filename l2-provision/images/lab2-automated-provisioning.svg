<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Automated CloudBank provisioning flow</title>
  <desc id="desc">The compartment OCID and provisioning script create OCI infrastructure, configure CloudBank, and validate the environment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#f5f8fb"/>
      <stop offset="1" stop-color="#edf5ef"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5f6b76"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2933">One script prepares the complete CloudBank environment</text>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="105" width="220" height="150" rx="16" fill="#fff" stroke="#2f6fad" stroke-width="3"/>
    <circle cx="165" cy="145" r="22" fill="#dcecff"/>
    <path d="M153 145h24M165 133v24" stroke="#2f6fad" stroke-width="4" stroke-linecap="round"/>
    <text x="165" y="192" text-anchor="middle" font-size="20" font-weight="700" fill="#243746">Compartment OCID</text>
    <text x="165" y="221" text-anchor="middle" font-size="15" fill="#52616b">User input</text>

    <line x1="285" y1="180" x2="397" y2="180" stroke="#5f6b76" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="410" y="85" width="380" height="190" rx="16" fill="#132f4c"/>
    <text x="600" y="130" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">provision.sh</text>
    <text x="600" y="166" text-anchor="middle" font-size="15" fill="#dcecff">OCI network + ADB + compute</text>
    <text x="600" y="195" text-anchor="middle" font-size="15" fill="#dcecff">Wallet + Saga users + CloudBank</text>
    <text x="600" y="224" text-anchor="middle" font-size="15" fill="#dcecff">Podman + transfer + validation</text>

    <line x1="800" y1="180" x2="912" y2="180" stroke="#5f6b76" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="925" y="105" width="220" height="150" rx="16" fill="#fff" stroke="#2e7d32" stroke-width="3"/>
    <circle cx="1035" cy="145" r="22" fill="#dff3e4"/>
    <path d="M1023 145l8 8 17-19" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1035" y="192" text-anchor="middle" font-size="20" font-weight="700" fill="#243746">Environment ready</text>
    <text x="1035" y="221" text-anchor="middle" font-size="15" fill="#52616b">Validated automatically</text>
  </g>
</svg>
